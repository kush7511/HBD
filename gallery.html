<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Birthday Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="responsive.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script defer src="music-engine.js"></script>
  <script defer src="script.js"></script>
</head>
<body data-page="gallery">
  <div class="loader" aria-live="polite"><div class="loader-heart">♡</div><p>Arranging the photos...</p><div class="loader-line"><span></span></div></div>
  <canvas id="sparkleCanvas" aria-hidden="true"></canvas>
  <div class="cursor-dot" aria-hidden="true"></div>
  <div class="transition-layer" aria-hidden="true"></div>
  <header class="site-header">
    <a class="brand page-link" href="index.html">HB</a>
    <button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false"><span></span><span></span></button>
    <nav class="main-nav" aria-label="Main navigation">
      <a class="page-link" href="index.html">Home</a>
      <a class="page-link" href="memories.html">Memories</a>
      <a class="page-link active" href="gallery.html">Gallery</a>
      <a class="page-link" href="surprise.html">Surprise</a>
    </nav>
  </header>
  <main class="subpage">
    <section class="page-hero section-shell reveal">
      <span class="script-kicker">✨ Beautiful Memories ✨</span>
      <h1>A gallery made for smiles.</h1>
      <p>Tap any frame to open it full screen. Replace the placeholder files later and the gallery updates automatically.</p>
    </section>
    <section class="gallery-masonry section-shell" data-gallery></section>
  </main>
  <div class="lightbox" data-lightbox hidden role="dialog" aria-modal="true" aria-label="Photo viewer">
    <button class="lightbox-close" type="button" data-lightbox-close aria-label="Close viewer">×</button>
    <button class="lightbox-nav prev" type="button" data-lightbox-prev aria-label="Previous photo">‹</button>
    <figure><img data-lightbox-img alt=""><figcaption data-lightbox-caption></figcaption></figure>
    <button class="lightbox-nav next" type="button" data-lightbox-next aria-label="Next photo">›</button>
  </div>
  <footer class="site-credit">Designed and developed by <strong>Kush</strong></footer>
</body>
</html>
